name: Release

# Tag vX.Y.Z (stable) or vX.Y.Z-rc.N / vX.Y.Z-beta.N (beta, GitHub prerelease):
# run the tests, build the release tarball with scripts/build-release.sh,
# sign SHA256SUMS with cosign keyless (GitHub OIDC), publish a GitHub Release.
# Asset + verification contract: docs/packaging/RELEASES.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Python tests
    if: github.repository == 'ai-Aquarium/aquarium'
    uses: ./.github/workflows/tests.yml
    with:
      slice_count: 8

  agent-home:
    name: agent-home typecheck + lint + tests
    if: github.repository == 'ai-Aquarium/aquarium'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts
      - run: npm run --prefix agent-home typecheck
      - run: npm run --prefix agent-home lint
      - run: npm run --prefix agent-home test

  build:
    name: Build + sign tarball
    needs: [tests, agent-home]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # cosign keyless: GitHub OIDC token -> Fulcio certificate
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build tarball
        run: scripts/build-release.sh "$GITHUB_REF_NAME" --out dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            --bundle SHA256SUMS.cosign.bundle \
            SHA256SUMS
      - name: Verify like the installer does
        working-directory: dist
        run: |
          cosign verify-blob \
            --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -tzf "aquarium-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" | head -1 | grep -qx "aquarium-${GITHUB_REF_NAME}/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  rehearse:
    name: Rehearse the upgrade from the previous release
    # Blocks publish: the previous published release's OWN job code upgrades to the
    # tarball just built, the new command finishes the root copies, then rolls back.
    # Real: both releases' aquarium command + helper/sudoers files (from the tarballs),
    # signature check of the previous release, visudo, file modes, the job/state/rollback
    # code. Fake: systemd, Docker/Postgres, GitHub API, sudo, the build (no full install
    # in CI). See tests/deploy/test_aquarium_upgrade_rehearsal.py and RELEASES.md §8.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0 # tags: also rehearse from v0.2.7 and the newest tag
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Download and verify the previous published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # the newest stable release strictly older than this tag (a hotfix below the
          # latest line rehearses from its own predecessor, never a downgrade)
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName' | python3 -c '
          import re, sys
          num = lambda t: tuple(int(x) for x in re.match(r"v(\d+)\.(\d+)\.(\d+)", t).groups())
          target = num(sys.argv[1])
          tags = [t for t in sys.stdin.read().split() if re.fullmatch(r"v\d+\.\d+\.\d+", t) and num(t) < target]
          print(max(tags, key=num) if tags else "")' "$TAG")
          [ -n "$PREV" ] || { echo "no published release older than $TAG"; exit 1; }
          echo "previous release: $PREV"
          mkdir prev
          gh release download "$PREV" --repo "$GITHUB_REPOSITORY" --dir prev \
            -p "aquarium-${PREV}-linux-x86_64.tar.gz" -p SHA256SUMS -p SHA256SUMS.sig -p SHA256SUMS.pem
          cd prev
          # releases before the move to ai-Aquarium were signed in leolau/aquarium
          signed=
          for repo in "$GITHUB_REPOSITORY" leolau/aquarium; do
            if cosign verify-blob --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
                --certificate-identity "https://github.com/${repo}/.github/workflows/release.yml@refs/tags/${PREV}" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS; then
              signed=1
              break
            fi
          done
          [ -n "$signed" ] || { echo "signature check failed for $PREV"; exit 1; }
          sha256sum -c SHA256SUMS
          echo "AQUARIUM_REHEARSAL_FROM=$PWD/aquarium-${PREV}-linux-x86_64.tar.gz" >> "$GITHUB_ENV"
          echo "AQUARIUM_REHEARSAL_TO=$GITHUB_WORKSPACE/dist/aquarium-${TAG}-linux-x86_64.tar.gz" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
      - run: uv python install 3.11
      - uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev
      - name: Rehearse previous release -> this tag (tarballs), then rollback
        run: |
          set -euo pipefail
          test -f "$AQUARIUM_REHEARSAL_FROM" && test -f "$AQUARIUM_REHEARSAL_TO"
          scripts/run_tests.sh tests/deploy/test_aquarium_upgrade_rehearsal.py
      - name: Rehearse v0.2.7 and the newest tag -> this tree
        run: |
          unset AQUARIUM_REHEARSAL_FROM AQUARIUM_REHEARSAL_TO
          scripts/run_tests.sh tests/deploy/test_aquarium_upgrade_rehearsal.py \
            tests/deploy/test_aquarium_upgrade_root_copies.py tests/deploy/test_aquarium_upgrade.py

  publish:
    name: Publish GitHub Release
    needs: [build, rehearse]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create release and update channels.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CHANNEL=$(python3 scripts/release_channels.py check "$TAG")
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[]' | jq -s . > releases.json
          python3 scripts/release_channels.py channels "$TAG" --releases releases.json \
            --repo "$GITHUB_REPOSITORY" > dist/channels.json
          cat dist/channels.json
          cat > notes.md <<NOTES
          Channel: **${CHANNEL}**

          Verify before installing (needs [cosign](https://docs.sigstore.dev/cosign/system_config/installation/) v2):

          \`\`\`
          cosign verify-blob --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS
          \`\`\`
          NOTES
          sed -i 's/^          //' notes.md
          STABLE=$(jq -r '.channels.stable.version // empty' dist/channels.json)
          # Only the newest stable becomes "Latest" (a v1.0.1 hotfix after v1.1.0 does not).
          FLAGS=(--latest=false)
          [ "$STABLE" = "$TAG" ] && FLAGS=(--latest)
          [ "$CHANNEL" = beta ] && FLAGS=(--prerelease --latest=false)
          gh release create "$TAG" --verify-tag --title "Aquarium $TAG" \
            --notes-file notes.md --generate-notes "${FLAGS[@]}" \
            dist/aquarium-*-linux-x86_64.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig \
            dist/SHA256SUMS.pem dist/SHA256SUMS.cosign.bundle dist/channels.json
          # Keep releases/latest/download/channels.json current after a beta or hotfix.
          if [ -n "$STABLE" ] && [ "$STABLE" != "$TAG" ]; then
            gh release upload "$STABLE" dist/channels.json --clobber
          fi
