# Drop-in for app-mcp.service, installed as
# /etc/systemd/system/app-mcp.service.d/50-coverage-ledger.conf by install-aquarium.sh
# and by `aquarium update` / Settings -> Software upgrade on any box that runs app-mcp.
#
# The one write app-mcp makes: its coverage ledger (app-mcp/app_mcp/ledger.py).
# ProtectSystem=strict keeps everything else read-only; systemd creates
# /var/lib/app-mcp owned by the unit's user, makes it writable and passes it as
# $STATE_DIRECTORY. The path is the same on every box, so this file is copied as is.
# hermes-appmcp-hint-sweep.service reads the same folder.
[Service]
StateDirectory=app-mcp
StateDirectoryMode=0700
